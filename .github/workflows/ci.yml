name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and run self-tests
        env:
          CC: ${{ matrix.compiler }}
        run: make clean check
